site_name: openodke
site_description: >-
  The verification layer between any extractor and the graph store: ground,
  resolve, corroborate and evaluate extracted triples.
site_url: https://openodke.dev/
repo_url: https://github.com/deepskandpal/odke
repo_name: deepskandpal/odke
edit_uri: edit/main/docs/
copyright: >-
  Apache-2.0. An independent implementation of the ODKE+ architecture
  (arXiv:2509.04696); not affiliated with or endorsed by Apple Inc.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# `mkdocs build --strict` turns every one of these into a failed build, so a
# link to a page or a heading that no longer exists cannot ship.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Pages that were renamed or merged keep their old URLs.
plugins:
  - search
  - redirects:
      redirect_maps:
        loaders-and-extraction.md: loading.md
        sinks.md: stores.md
        neo4j.md: stores.md#neo4j
        inference.md: ontology.md#drafting-one-parked
        triples.md: inputs.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Install: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Verify:
      - "The Validator": validator.md
      - Inputs: inputs.md
      - "Loading documents": loading.md
      - Grounding: grounding.md
      - "Resolution & corroboration": resolution-and-corroboration.md
      - "Write to a store": stores.md
      - "odke run": run.md
  - Evaluate:
      - Evaluation: evaluation.md
      - Benchmarks: benchmarks.md
  - Reference:
      - "Models & providers": models.md
      - Ontology: ontology.md
      - "Reference extractor": reference-extractor.md
      - Decisions: decisions.md
