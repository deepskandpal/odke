# Every new issue and pull request lands on the board automatically.
#
# The default GITHUB_TOKEN cannot write to a user-owned Project, so this needs a
# fine-grained PAT with the "Projects: read and write" permission, stored as the
# repository secret PROJECT_TOKEN. Without it the step is skipped rather than
# failing, so a fork or a contributor without the secret never sees a red X for
# something that is not their problem.
#
# The token is hoisted into a job-level env var because the `secrets` context is
# not available inside a step's `if:` — checking it there looks right and never
# matches.

name: add-to-project

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Add to the odke board
        if: env.PROJECT_TOKEN != ''
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/deepskandpal/projects/6
          github-token: ${{ env.PROJECT_TOKEN }}
